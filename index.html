<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4fff">
<title>Пакетный ресайз фото</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#17202e;--mut:#5d6b7e;--line:#cfd6e0;--acc:#1f4fff;--onacc:#fff;--err:#c62828;--chk:#e3e8ef;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root{--bg:#12161d;--card:#1b212b;--ink:#e8ecf2;--mut:#98a5b8;--line:#2e3846;--acc:#7893ff;--onacc:#0c1220;--err:#ff8a80;--chk:#2a323f}}
*,*::before,*::after{box-sizing:inherit}
html{padding-top:env(safe-area-inset-top,0px);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
main{max-width:1100px;margin:0 auto;padding:20px 16px}
h1{font-size:clamp(26px,5vw,38px);line-height:1.1;letter-spacing:-.03em;margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 20px;max-width:60ch}
.drop{display:block;border:2px dashed var(--line);border-radius:14px;padding:28px 16px;text-align:center;cursor:pointer;background:var(--card);transition:border-color .15s,background .15s}
.drop.on,.drop:hover,.drop:focus-within{border-color:var(--acc)}
.drop b{display:block;font-size:19px}.drop span{color:var(--mut);font-size:14px}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:16px 0}
.panel h2{font-size:17px;margin:0 0 12px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
.f label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
.f label.c{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px;min-height:44px}
.f .chips{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
input[type=number],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px;width:100%}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc)}
input[type=range]{accent-color:var(--acc);min-height:44px}
button{font:inherit;font-size:14px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chips button{min-height:36px;padding:0 12px;background:var(--chk);border-color:transparent}
button.p{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:600}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pv{aspect-ratio:4/3;display:grid;place-items:center;background:repeating-conic-gradient(var(--chk) 0 25%,transparent 0 50%) 0 0/16px 16px;padding:8px}
.pv canvas{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 0 0 1px var(--line)}
.meta{padding:10px 12px 0;min-width:0}
.nm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.dim{display:block;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.dim.e{color:var(--err)}
.own{padding:0 12px}.own .f{grid-template-columns:1fr 1fr;padding-top:8px}
.card .c0{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:14px;min-height:44px}
.row{display:flex;gap:8px;padding:8px 12px 12px;margin-top:auto}.row button{flex:1}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.bar[hidden]{display:none}
#st{color:var(--mut);font-size:14px;margin-right:auto}
.empty{color:var(--mut);text-align:center;padding:30px 0}
</style>
</head>
<body>
<main>
  <h1>Пакетный ресайз фото</h1>
  <p class="sub">Всё считается прямо на устройстве, фото никуда не отправляются. Задайте размер сразу для всех или отдельно для любого фото.</p>
  <label class="drop" id="dz">
    <input type="file" id="fi" accept="image/*" multiple>
    <b>Выберите фото или перетащите сюда</b>
    <span>Можно сразу много: JPG, PNG, WebP (HEIC — только в Safari)</span>
  </label>
  <section class="panel"><h2>Настройки для всех фото</h2><div id="g"></div></section>
  <div class="empty" id="em">Пока нет фото</div>
  <div class="grid" id="list"></div>
</main>
<div class="bar" id="bar" hidden>
  <span id="st"></span>
  <button id="clr">Очистить</button>
  <button id="shr" hidden>В галерею</button>
  <button class="p" id="zip">Скачать все</button>
</div>
<script>
const $=s=>document.querySelector(s);
const def=()=>({mode:'px',w:1080,h:'',by:'w',pct:50,keep:true,fit:'cover',bg:'transparent',noUp:false,fmt:'orig',q:90});
const G=def(),items=[];let uid=0;
const opt=(v,t,c)=>`<option value="${v}"${c==v?' selected':''}>${t}</option>`;
const chip=(k,n)=>`<button type="button" data-chip="${k}:${n}">${n}${k==='pct'?'%':''}</button>`;

function form(o){
  let h=`<div class="f"><label>Способ<select data-k="mode">${opt('px','Пиксели',o.mode)}${opt('pct','Проценты',o.mode)}</select></label>`;
  if(o.mode==='px'){
    h+=`<label>Ширина, px<input type="number" data-k="w" min="1" max="16384" inputmode="numeric" placeholder="авто" value="${o.w}"></label>
    <label>Высота, px<input type="number" data-k="h" min="1" max="16384" inputmode="numeric" placeholder="авто" value="${o.h}"></label>
    <div class="chips">${[640,1080,1920,2560].map(n=>chip('w',n)).join('')}</div>
    <label class="c"><input type="checkbox" data-k="keep"${o.keep?' checked':''}>Сохранять пропорции</label>`;
    if(!o.keep){
      h+=`<label>Заполнение<select data-k="fit">${opt('cover','Обрезать',o.fit)}${opt('contain','Вписать с полями',o.fit)}${opt('stretch','Растянуть',o.fit)}</select></label>`;
      if(o.fit==='contain')h+=`<label>Поля<select data-k="bg">${opt('transparent','Прозрачные',o.bg)}${opt('#ffffff','Белые',o.bg)}${opt('#000000','Чёрные',o.bg)}</select></label>`;
    }
  }else{
    h+=`<label>Масштаб, %<input type="number" data-k="pct" min="1" max="400" inputmode="numeric" value="${o.pct}"></label>
    <div class="chips">${[25,50,75,200].map(n=>chip('pct',n)).join('')}</div>`;
  }
  h+=`<label class="c"><input type="checkbox" data-k="noUp"${o.noUp?' checked':''}>Не увеличивать</label>
  <label>Формат<select data-k="fmt">${opt('orig','Как у исходника',o.fmt)}${opt('jpeg','JPG',o.fmt)}${opt('png','PNG',o.fmt)}${opt('webp','WebP',o.fmt)}</select></label>`;
  if(o.fmt!=='png')h+=`<label>Качество JPG/WebP<input type="range" data-k="q" min="40" max="100" value="${o.q}"></label>`;
  return h+'</div>';
}

function bind(root,o,done){
  const redraw=()=>{root.innerHTML=form(o)};
  root.oninput=root.onchange=e=>{
    const t=e.target,k=t.dataset.k;if(!k)return;
    const v=t.type==='checkbox'?t.checked:(t.type==='number'||t.type==='range')?(t.value===''?'':+t.value):t.value;
    o[k]=v;
    if(e.type==='input'&&(k==='w'||k==='h')&&o.keep){
      const x=k==='w'?'h':'w';o.by=k;o[x]='';
      const el=root.querySelector(`[data-k=${x}]`);if(el)el.value='';
    }
    if(k==='keep'&&v){if(o.w===''){o.by='h'}else{o.by='w';o.h=''}}
    if(e.type==='change'&&['mode','keep','fmt','fit'].includes(k))redraw();
    done();
  };
  root.onclick=e=>{
    const c=e.target.closest('[data-chip]');if(!c)return;
    const[k,v]=c.dataset.chip.split(':');o[k]=+v;
    if(k==='w'&&o.keep){o.by='w';o.h=''}
    redraw();done();
  };
  redraw();
}

function size(o,iw,ih){
  let W,H;
  if(o.mode==='pct'){const k=(o.pct||100)/100;W=iw*k;H=ih*k}
  else if(o.keep){
    if(o.by==='h'&&o.h){H=o.h;W=H*iw/ih}else if(o.w){W=o.w;H=W*ih/iw}else{W=iw;H=ih}
  }else{W=o.w||iw;H=o.h||ih}
  if(o.noUp){const f=Math.min(1,iw/W,ih/H);W*=f;H*=f}
  return{W:Math.max(1,Math.round(W)),H:Math.max(1,Math.round(H))};
}
const fitOf=o=>(o.mode==='px'&&!o.keep)?o.fit:'stretch';
function outType(o,it){
  let t=o.fmt==='orig'?it.file.type:'image/'+o.fmt;
  if(!['image/jpeg','image/png','image/webp'].includes(t))t='image/png';
  if(t==='image/jpeg'&&fitOf(o)==='contain'&&o.bg==='transparent')t='image/png';
  return t;
}
const ext=t=>t==='image/jpeg'?'jpg':t.split('/')[1];

function paint(cv,img,o,W,H,k,jpg){
  const w=Math.max(1,Math.round(W*k)),h=Math.max(1,Math.round(H*k));
  cv.width=w;cv.height=h;
  const c=cv.getContext('2d');c.imageSmoothingQuality='high';
  const f=fitOf(o),iw=img.width,ih=img.height;
  if(jpg||(f==='contain'&&o.bg!=='transparent')){c.fillStyle=f==='contain'&&o.bg!=='transparent'?o.bg:'#fff';c.fillRect(0,0,w,h)}
  if(f==='stretch')c.drawImage(img,0,0,w,h);
  else{const s=f==='cover'?Math.max(w/iw,h/ih):Math.min(w/iw,h/ih),dw=iw*s,dh=ih*s;c.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh)}
}

const cur=it=>it.own?it.o:G;
function update(it){
  const o=cur(it),{W,H}=size(o,it.img.width,it.img.height),t=outType(o,it);
  const bad=W>16384||H>16384||W*H>40e6;
  const d=it.el.querySelector('.dim');
  d.className='dim'+(bad?' e':'');
  d.textContent=bad?`${W}×${H} — слишком много (макс. 16384 px и 40 Мп)`:`${it.img.width}×${it.img.height} → ${W}×${H} · ${ext(t).toUpperCase()}`;
  it.el.querySelector('[data-dl]').disabled=bad;
  it.bad=bad;
  if(!bad)paint(it.el.querySelector('canvas'),it.img,o,W,H,Math.min(1,520/Math.max(W,H)),t==='image/jpeg');
}
let tm;
const updateAll=()=>{clearTimeout(tm);tm=setTimeout(()=>items.forEach(it=>{if(!it.own)update(it)}),80)};

async function blobOf(it){
  const o=cur(it),{W,H}=size(o,it.img.width,it.img.height),t=outType(o,it);
  const cv=document.createElement('canvas');
  paint(cv,it.img,o,W,H,1,t==='image/jpeg');
  const b=await new Promise(r=>cv.toBlob(r,t,o.q/100));
  cv.width=cv.height=0;
  if(!b)throw new Error('Не хватило памяти устройства');
  return{b,name:it.file.name.replace(/\.[^.]+$/,'')+`_${W}x${H}.${ext(t)}`};
}
function save(b,name){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000)}

async function add(files){
  for(const f of files){
    if(!f.type.startsWith('image/'))continue;
    let img;try{img=await createImageBitmap(f)}catch{alert(`Не удалось открыть «${f.name}»`);continue}
    const it={id:++uid,file:f,img,own:false,o:null,bad:false};
    const el=document.createElement('article');el.className='card';
    el.innerHTML=`<div class="pv"><canvas></canvas></div><div class="meta"><b class="nm"></b><span class="dim"></span></div>
    <label class="c0"><input type="checkbox" data-own>Свои настройки</label><div class="own" hidden></div>
    <div class="row"><button data-dl>Скачать</button><button data-rm>Убрать</button></div>`;
    el.querySelector('.nm').textContent=f.name;
    it.el=el;items.push(it);$('#list').append(el);
    el.querySelector('[data-own]').onchange=e=>{
      it.own=e.target.checked;const box=el.querySelector('.own');box.hidden=!it.own;
      if(it.own){it.o={...G};bind(box,it.o,()=>update(it))}
      update(it);
    };
    el.querySelector('[data-rm]').onclick=()=>{img.close&&img.close();items.splice(items.indexOf(it),1);el.remove();sync()};
    el.querySelector('[data-dl]').onclick=async e=>{
      e.target.disabled=true;
      try{const r=await blobOf(it);save(r.b,r.name)}catch(x){alert(x.message)}
      e.target.disabled=it.bad;
    };
    update(it);sync();
  }
}
function sync(){
  $('#em').hidden=items.length>0;$('#bar').hidden=!items.length;
  $('#st').textContent=`Фото: ${items.length}`;
}

async function all(){
  const out=[],used=new Set();
  for(let i=0;i<items.length;i++){
    if(items[i].bad)continue;
    $('#st').textContent=`Обработка ${i+1} из ${items.length}…`;
    try{
      const r=await blobOf(items[i]);let n=r.name,k=1;
      while(used.has(n))n=r.name.replace(/(\.\w+)$/,`_${++k}$1`);
      used.add(n);out.push({name:n,b:r.b});
    }catch(x){alert(`${items[i].file.name}: ${x.message}`)}
  }
  sync();return out;
}

$('#zip').onclick=async e=>{
  e.target.disabled=true;
  const r=await all();
  for(let i=0;i<r.length;i++){
    $('#st').textContent=`Сохранение ${i+1} из ${r.length}…`;
    save(r[i].b,r[i].name);
    await new Promise(res=>setTimeout(res,400));
  }
  sync();e.target.disabled=false;
};
const canShare=()=>navigator.canShare&&navigator.canShare({files:[new File([''],'a.png',{type:'image/png'})]});
if(canShare())$('#shr').hidden=false;
$('#shr').onclick=async e=>{
  e.target.disabled=true;
  const r=await all();
  try{if(r.length)await navigator.share({files:r.map(x=>new File([x.b],x.name,{type:x.b.type}))})}catch{}
  e.target.disabled=false;
};
$('#clr').onclick=()=>{items.splice(0).forEach(i=>{i.el.remove();i.img.close&&i.img.close()});sync()};

bind($('#g'),G,updateAll);
$('#fi').onchange=e=>{add([...e.target.files]);e.target.value=''};
const dz=$('#dz');
['dragenter','dragover'].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.add('on')}));
['dragleave','drop'].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.remove('on')}));
dz.addEventListener('drop',e=>add([...e.dataTransfer.files]));
addEventListener('paste',e=>add([...(e.clipboardData?.files||[])]));
sync();
</script>
</body>
</html>
